<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 游戏</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">🐍 贪吃蛇</a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="game.html">开始游戏</a>
      <a href="list.html">排行榜</a>
    </nav>
    <div class="nav-right">
      <button id="themeBtn" class="theme-btn" title="切换主题">🌙</button>
    </div>
  </div>
</header>

<main class="wrap game-main">

  <section class="game-panel">
    <div class="score-bar">
      <span>得分：<strong id="score">0</strong></span>
      <span>最高：<strong id="best">0</strong></span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="game-actions">
      <button id="startBtn" class="btn">开始</button>
      <button id="pauseBtn" class="btn" disabled>暂停</button>
      <button id="restartBtn" class="btn" disabled>重来</button>
    </div>

    <div class="dpad" id="dpad">
      <button data-dir="up">↑</button>
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>

    <p id="gameMsg" class="game-msg">按“开始”或方向键出发</p>
  </section>

  <aside class="game-side">
    <h2>操作说明</h2>
    <ul>
      <li>↑ ↓ ← → 或 W A S D 控制方向</li>
      <li>空格键暂停 / 继续</li>
      <li>手机可滑动屏幕或点虚拟键</li>
    </ul>

    <h2>难度</h2>
    <select id="speedSelect">
      <option value="easy">简单（穿墙）</option>
      <option value="normal" selected>普通</option>
      <option value="hard">困难（带障碍）</option>
    </select>
  </aside>

</main>

<footer class="site-footer">
  <p>&copy; 2026 贪吃蛇 · HTML5 实训作品</p>
</footer>

<script src="js/common.js"></script>
<script src="js/game.js"></script>
</body>
</html>
